<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
</head>
<body>

    <form action="" method="get">
        <p>
            Nombre: <input type="text" name="name_control" autofocus required />
        </p>
        <p>
            Correo electrónico: <input type="email" name="email_control" required />
        </p>
        <p>
            URL: <input type="url" name="url_control" placeholder="Escribe la URL de tu página web personal" />
        </p>
        <p> <input type="checkbox" name="condiciones" required /> Declaro haber leido y aceptar las condiciones generales del programa y la normativa sobre protección de datos
        </p>
        <p>
            <input type="submit" value="Enviar" />
        </p>
    </form>

</body>
</html>
