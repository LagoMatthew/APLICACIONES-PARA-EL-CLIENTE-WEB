<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introducción a JavaScript</title>
</head>
<body>

    <h1>Prueba de JavaScript</h1>
    <p>Si el código funciona, el fondo será rojo y verás una alerta emergente.</p>

    <script>
        // ---------------------------------------------------------
        // 1. COMENTARIOS DE UNA SOLA LÍNEA
        // Este modo permite comentar una sola línea.
        // Todo lo que escribas después de las dos barras será ignorado.
        // ---------------------------------------------------------

        /* 2. COMENTARIOS MULTILÍNEA
           Este modo permite realizar
           comentarios extensos
           de varias líneas. 
        */

        // 3. DISTINGUE MAYÚSCULAS Y MINÚSCULAS (Case Sensitivity)
        // JavaScript es muy estricto con esto. 
        // Si escribes Alert() en lugar de alert(), el código fallará.

        // Cambiamos el color de fondo (Forma moderna)
        document.body.style.backgroundColor = "red";

        // Mostramos la alerta
        alert('Cambiamos el color de la página');
    </script>

</body>
</html>
