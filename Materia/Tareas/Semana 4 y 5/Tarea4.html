<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Operaciones en Bucle</title>
</head>
<body>
    <script type="text/javascript">
        // 1. Ingreso de los 2 números
        var n1 = parseFloat(prompt("Introduce el primer número:"));
        var n2 = parseFloat(prompt("Introduce el segundo número:"));

        // 2. Realizar un bucle de 5 iteraciones
        // Usamos i de 1 a 5 para identificar cada paso
        for (var i = 1; i <= 5; i++) {
            
            var resultado;
            var operacion;

            if (i == 1) {
                // PRIMERA iteración: SUMA
                operacion = "SUMA";
                resultado = n1 + n2;
            } 
            else if (i == 2) {
                // SEGUNDA iteración: RESTA
                operacion = "RESTA";
                resultado = n1 - n2;
            } 
            else if (i == 3) {
                // TERCERA iteración: MULTIPLICA
                operacion = "MULTIPLICACIÓN";
                resultado = n1 * n2;
            } 
            else if (i == 4) {
                // CUARTA iteración: DIVIDE
                operacion = "DIVISIÓN";
                // Validación simple para no dividir por cero
                resultado = (n2 != 0) ? (n1 / n2) : "Error (División por 0)";
            } 
            else if (i == 5) {
                // QUINTA iteración: MOD (%)
                operacion = "MÓDULO (%)";
                resultado = (n2 != 0) ? (n1 % n2) : "Error";
            }

            // Mostrar el resultado de la iteración actual
            alert("Iteración " + i + "\nOperación: " + operacion + "\nResultado: " + resultado);
        }
    </script>
</body>
</html>
